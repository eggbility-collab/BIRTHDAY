<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Baby</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAE6DF;
            --surface: #F2EDE4;
            --butter: #F2D46F;
            --blush: #F2B2BE;
            --deep-pink: #D96E88;
            --cocoa: #593E3A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            font-family: 'Nunito', sans-serif;
            color: var(--cocoa);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Main Area */
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            width: 100%;
        }

        /* Top Progress Bar */
        .header {
            width: 90%;
            max-width: 800px;
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.05), -6px -6px 12px rgba(255,255,255,0.8);
            margin-bottom: 50px;
            margin-top: 20px;
        }

        .progress-text {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            flex: 1;
            text-align: center;
        }

        .progress-bar {
            width: 30%;
            height: 12px;
            background: #e0d8cd;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--deep-pink);
            border-radius: 10px;
        }

        .score {
            font-weight: 800;
            color: var(--deep-pink);
            margin-left: 20px;
        }

        /* Center Hero Blob */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
            z-index: 2;
        }

        .blob {
            background: var(--blush);
            padding: 60px 50px;
            /* Organic Clay Shape */
            border-radius: 46% 54% 48% 52% / 55% 43% 57% 45%; 
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.1), 
                -10px -10px 20px rgba(255,255,255,0.8),
                inset -5px -5px 15px rgba(217, 110, 136, 0.2),
                inset 5px 5px 15px rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 40px;
            animation: float 6s ease-in-out infinite;
            max-width: 90vw;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .blob h1 {
            font-family: 'Caveat', cursive;
            font-size: 65px;
            color: var(--cocoa);
            margin-bottom: 15px;
            line-height: 0.9;
        }

        .blob p {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            color: var(--cocoa);
            font-weight: 600;
            margin-top: 15px;
        }

        /* Start Button */
        .start-btn {
            background: var(--butter);
            color: var(--cocoa);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 600;
            padding: 20px 50px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 
                6px 6px 15px rgba(0,0,0,0.1), 
                -6px -6px 15px rgba(255,255,255,0.8),
                inset -3px -3px 8px rgba(200, 160, 50, 0.3),
                inset 3px 3px 8px rgba(255,255,255,0.8);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 2;
        }

        .start-btn:active {
            box-shadow: 
                inset 6px 6px 10px rgba(200, 160, 50, 0.4),
                inset -6px -6px 10px rgba(255,255,255,0.8);
            transform: translateY(2px);
        }

        /* Scattered Decor */
        .decor-heart {
            position: absolute;
            color: var(--blush);
            font-size: 30px;
            animation: float 4s ease-in-out infinite;
            z-index: 1;
        }
        .h1 { top: 25%; left: 15%; font-size: 40px; }
        .h2 { top: 75%; right: 20%; font-size: 25px; animation-delay: 1s; }
        .h3 { top: 40%; right: 10%; font-size: 15px; animation-delay: 2s; }
        .h4 { top: 60%; left: 20%; font-size: 20px; animation-delay: 3s; }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .blob { padding: 50px 30px; }
            .blob h1 { font-size: 50px; }
            .blob p { font-size: 22px; }
            .progress-bar { display: none; }
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .score { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Top Bar -->
        <div class="header">
            <span class="progress-text">TIP: you should click that button that says start now 😉</span>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <span class="score">0 / 15</span>
        </div>

        <!-- Center Hero -->
        <div class="hero">
            <div class="blob">
                <h1>HAPPY BIRTHDAY<br>BABY</h1>
                <p>ingredients are love, code, and ambot👁️👁️</p>
            </div>
            
            <button class="start-btn">
                Start Now ➔
            </button>
        </div>

        <!-- Decorations -->
        <div class="decor-heart h1">♥</div>
        <div class="decor-heart h2">♥</div>
        <div class="decor-heart h3">♥</div>
        <div class="decor-heart h4">♥</div>

    </div>

</body>
</html>
