<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Baby</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAE6DF;
            --surface: #F2EDE4;
            --butter: #F2D46F;
            --blush: #F2B2BE;
            --deep-pink: #D96E88;
            --cocoa: #593E3A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            font-family: 'Nunito', sans-serif;
            color: var(--cocoa);
            display: flex;
            min-height: 100vh;
            overflow: hidden; 
        }

        /* --- RAIN CONTAINER --- */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; 
            z-index: 0;
        }

        /* Base shape for both the heart and the ghosts */
        .heart-shape {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 2px;
        }

        .heart-shape::before,
        .heart-shape::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }

        .heart-shape::before { top: -7px; left: 0; }
        .heart-shape::after { top: 0; left: -7px; }

        /* --- THE ACTUAL YELLOW HEART --- */
        .yellow-heart {
            background: var(--butter);
            box-shadow: 0 0 10px var(--butter);
            z-index: 10;
        }
        .yellow-heart::before, .yellow-heart::after {
            background: var(--butter);
            box-shadow: 0 0 10px var(--butter);
        }

        /* --- THE GHOST AFTERIMAGES --- */
        .ghost-heart {
            z-index: 5;
            /* Fade out over 6 seconds */
            animation: fadeGhost 6s forwards; 
        }

        /* The ghost shapes take the color assigned by JS */
        .ghost-heart, .ghost-heart::before, .ghost-heart::after {
            background: var(--ghost-color);
            box-shadow: 0 0 10px var(--ghost-color);
        }

        @keyframes fadeGhost {
            0% { opacity: 0.9; }
            80% { opacity: 0.3; }
            100% { opacity: 0; }
        }

        /* Main Area */
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            width: 100%;
            z-index: 2; 
        }

        /* Top Progress Bar */
        .header {
            width: 90%;
            max-width: 800px;
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.05), -6px -6px 12px rgba(255,255,255,0.8);
            margin-bottom: 50px;
            margin-top: 20px;
        }

        .progress-text {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            flex: 1;
            text-align: center;
        }

        .progress-bar {
            width: 30%;
            height: 12px;
            background: #e0d8cd;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--deep-pink);
            border-radius: 10px;
        }

        .score {
            font-weight: 800;
            color: var(--deep-pink);
            margin-left: 20px;
        }

        /* Center Hero Blob */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .blob {
            background: var(--blush);
            padding: 60px 50px;
            border-radius: 46% 54% 48% 52% / 55% 43% 57% 45%; 
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.1), 
                -10px -10px 20px rgba(255,255,255,0.8),
                inset -5px -5px 15px rgba(217, 110, 136, 0.2),
                inset 5px 5px 15px rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 40px;
            animation: float 6s ease-in-out infinite;
            max-width: 90vw;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .blob h1 {
            font-family: 'Caveat', cursive;
            font-size: 65px;
            color: var(--cocoa);
            margin-bottom: 15px;
            line-height: 0.9;
        }

        .blob p {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            color: var(--cocoa);
            font-weight: 600;
            margin-top: 15px;
        }

        /* Start Button */
        .start-btn {
            background: var(--butter);
            color: var(--cocoa);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 600;
            padding: 20px 50px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 
                6px 6px 15px rgba(0,0,0,0.1), 
                -6px -6px 15px rgba(255,255,255,0.8),
                inset -3px -3px 8px rgba(200, 160, 50, 0.3),
                inset 3px 3px 8px rgba(255,255,255,0.8);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .start-btn:active {
            box-shadow: 
                inset 6px 6px 10px rgba(200, 160, 50, 0.4),
                inset -6px -6px 10px rgba(255,255,255,0.8);
            transform: translateY(2px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .blob { padding: 50px 30px; }
            .blob h1 { font-size: 50px; }
            .blob p { font-size: 22px; }
            .progress-bar { display: none; }
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .score { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div class="main-content">
        <div class="header">
            <span class="progress-text">TIP: you should click that button that says start now 😉</span>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <span class="score">0 / 15</span>
        </div>

        <div class="hero">
            <div class="blob">
                <h1>HAPPY BIRTHDAY<br>BABY</h1>
                <p>ingredients are love, code, and ambot👁️👁️</p>
            </div>
            
            <button class="start-btn">
                Start Now ➔
            </button>
        </div>
    </div>

    <script>
        const container = document.getElementById('heart-container');
        
        // The colors of the trails from the Cyberpunk image
        const trailColors = ['#00FF66', '#00FFFF', '#0088FF', '#8A2BE2'];

        function spawnHeart() {
            // Random starting X position and scale
            const startX = Math.random() * 90 + 5; // 5vw to 95vw
            const scale = Math.random() * 0.4 + 0.8; 
            const fallDuration = 4000; // 4 seconds to fall
            const startTime = performance.now();

            // Create the actual yellow heart
            const heart = document.createElement('div');
            heart.className = 'yellow-heart heart-shape';
            heart.style.left = startX + 'vw';
            container.appendChild(heart);

            let lastGhostTime = 0;

            // Animate it manually with JavaScript so we can track its exact position
            function animate(time) {
                const elapsed = time - startTime;
                const progress = elapsed / fallDuration;

                if (progress >= 1) {
                    heart.remove();
                    return;
                }

                // Calculate current position and rotation
                const y = -10 + (progress * 120); // -10vh to 110vh
                const rotation = 45 + (progress * 720); // 45deg to 765deg (spins twice)

                // Update the yellow heart
                heart.style.top = y + 'vh';
                heart.style.transform = `rotate(${rotation}deg) scale(${scale})`;

                // Spawn a ghost trail every 80 milliseconds
                if (time - lastGhostTime > 80) {
                    createGhost(startX, y, rotation, scale);
                    lastGhostTime = time;
                }

                requestAnimationFrame(animate);
            }

            requestAnimationFrame(animate);
        }

        function createGhost(x, y, rotation, scale) {
            const ghost = document.createElement('div');
            ghost.className = 'ghost-heart heart-shape';
            
            // Position the ghost exactly where the heart just was
            ghost.style.left = x + 'vw';
            ghost.style.top = y + 'vh';
            ghost.style.transform = `rotate(${rotation}deg) scale(${scale})`;

            // Pick a random color from the cyberpunk palette
            const color = trailColors[Math.floor(Math.random() * trailColors.length)];
            ghost.style.setProperty('--ghost-color', color);

            container.appendChild(ghost);

            // Delete the ghost after 6 seconds
            setTimeout(() => {
                ghost.remove();
            }, 6000);
        }

        // Spawn a new heart every 800ms (like rain)
        setInterval(spawnHeart, 800);
        
        // Spawn one immediately to start
        spawnHeart();
    </script>
</body>
</html>
