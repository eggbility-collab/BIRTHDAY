                else if (!dragging) { const Le = Math.max(L, 80), h = dt / 2; for (let i = 0; i < 2; i++) { omega += (-(G / Le) * Math.sin(theta) - DAMPING * omega) * h; theta += omega * h; if (theta > maxAngle) { theta = maxAngle; omega = -Math.abs(omega) * 0.3; } if (theta < -maxAngle) { theta = -maxAngle; omega = Math.abs(omega) * 0.3; } } omega = clamp(omega, -MAX_OMEGA, MAX_OMEGA); }
                render();
                const resting = !dropping && !dragging && Math.abs(theta * L) < 0.8 && Math.abs(omega * L) < 4;

            }
            function kick() { if (raf || document.hidden || snapped) return; last = performance.now(); raf = requestAnimationFrame(frame); }
            function impulse() { if (reduced()) return; omega = clamp(omega + tapDir * Math.sqrt(G / Math.max(L, 80)) * maxAngle * 0.7, -MAX_OMEGA, MAX_OMEGA); tapDir *= -1; }
            function register() { const now = performance.now(); if (snapped || stringClicks >= 4 || now - lastPluck < 250) return; lastPluck = now; stringClicks++; stringCounter.textContent = `${stringClicks} / 4`; stringCounter.style.opacity = '1'; if (stringClicks === 4) snap(); }
            function anchorPoint() { const r = redRopeContainer.getBoundingClientRect(); return { x: r.left, y: r.top }; }
            handle.addEventListener('pointerdown', (e) => { if (!enabled || snapped || dropping) return; e.preventDefault(); try { handle.setPointerCapture(e.pointerId); } catch (err) {} dragging = true; sx = e.clientX; sy = e.clientY; maxMove = 0; prevT = performance.now(); handle.classList.add('dragging'); kick(); });
            handle.addEventListener('pointermove', (e) => { if (!dragging) return; const a = anchorPoint(); const ang = clamp(Math.atan2(e.clientX - a.x, Math.max(e.clientY - a.y, 24)), -maxAngle, maxAngle); const now = performance.now(); const dtm = Math.max(1, now - prevT) / 1000; omega = clamp(omega * 0.55 + ((ang - theta) / dtm) * 0.45, -MAX_OMEGA, MAX_OMEGA); theta = ang; prevT = now; maxMove = Math.max(maxMove, Math.hypot(e.clientX - sx, e.clientY - sy)); });

            handle.addEventListener('keydown', (e) => { if (e.key !== 'Enter' && e.key !== ' ') return; e.preventDefault(); if (!enabled || snapped || dropping || e.repeat) return; impulse(); register(); kick(); });
            function snap() {
                snapped = true; enabled = false; dragging = false; if (raf) { cancelAnimationFrame(raf); raf = 0; } handle.style.pointerEvents = 'none'; handle.blur();
                if (!reduced()) {
                    const hx = L * Math.sin(theta), hy = L * Math.cos(theta); const lag = clamp(-omega * L * 0.035, -L * 0.16, L * 0.16);
                    const cx = hx * 0.5 + lag * Math.cos(theta), cy = hy * 0.5 - lag * Math.sin(theta); const bx = 0.5 * cx + 0.25 * hx, by = 0.5 * cy + 0.25 * hy;
                    setPaths(tailPaths, 'M' + f(bx) + ' ' + f(by) + ' Q' + f((bx + hx) / 2) + ' ' + f((by + hy) / 2) + ' ' + f(hx) + ' ' + f(hy));
                    tailEl.setAttribute('opacity', '1'); tailEl.animate([{ opacity: 1, transform: 'translate(0px,0px)' }, { opacity: 0, transform: 'translate(0px,40px)' }], { duration: 420, easing: 'ease-in', fill: 'forwards' });
                    const t0 = performance.now(), dir = hx >= 0 ? 1 : -1;
                    (function whip(t) { const p = Math.min(1, (t - t0) / 300), e = 1 - Math.pow(1 - p, 3); const ex = bx * (1 - e), ey = by * (1 - e); const curl = 20 * Math.sin(Math.PI * p) * dir; setPaths(ropePaths, 'M0 0 Q' + f(ex / 2 + curl) + ' ' + f(ey / 2) + ' ' + f(ex) + ' ' + f(ey)); if (p < 1) requestAnimationFrame(whip); else ropeEl.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 160, fill: 'forwards' }); })(t0);
                } else { ropeEl.setAttribute('opacity', '0'); }

                handle.style.transition = 'transform 8s cubic-bezier(0.4, 0, 0.2, 1)'; void handle.offsetWidth; handle.style.transform = 'translate(' + f(hx) + 'px,' + f(hy) + 'px) scale(500)';

        // ================= STAGE 3 <-> HEART SCENE =================

        let allGlyphs = [];

        const easeOutQuad = (t) => t * (2 - t);
        const smoothstep = (t) => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

        const FONT_CACHE = {};
        function getFont(size) {
            const key = Math.round(size * 10) / 10;

        function lerpColor(c1, c2, t) {

        }

        function pointInEllipse(px, py, cx, cy, rx, ry, angle) {
            angle = angle || 0;
            const cos = Math.cos(-angle), sin = Math.sin(-angle);
            const dx = px - cx, dy = py - cy;
            const lx = dx * cos - dy * sin;
            const ly = dx * sin + dy * cos;
            return (lx*lx)/(rx*rx) + (ly*ly)/(ry*ry) <= 1;
        }

        function addGlyph(glyphs, x, y, char, color, fontSize, rotation) {

        function buildStemGlyphs(glyphs, bx, by, tx, ty, f) {

                const t = (by - y) / Math.max(1, (by - ty));

                const cx = bx + (tx - bx) * t + curveOff;

        function buildLeafGlyphs(glyphs, bx, by, tx, ty, f) {

                { at: 0.40, side: -1, size: 1.0 },

                        if (pointInEllipse(x, y, ecx, ecy, lw/2, lh/2, angle)) {
                            const dist = Math.hypot(x - ecx, y - ecy) / Math.max(lw, lh);
                            addGlyph(glyphs, x, y, nextChar(), lerpColor('#5c8a3c', '#2f5d3a', dist), 8 * f.scale, angle);
                        }
                    }
                }
            }
        }

        function buildRosePetals(glyphs, cx, cy, f) {
            const baseR = 65 * f.scale;
            const rings = [
                { count: 5, radius: baseR * 0.85, pw: baseR * 0.85, ph: baseR * 1.00, rot: 0, colorA: '#e11d48', colorB: '#7f1d1d' },
                { count: 4, radius: baseR * 0.55, pw: baseR * 0.65, ph: baseR * 0.80, rot: 0.6, colorA: '#be123c', colorB: '#881337' },
                { count: 3, radius: baseR * 0.25, pw: baseR * 0.40, ph: baseR * 0.55, rot: 0.9, colorA: '#881337', colorB: '#4c0519' },
            ];
            for (const ring of rings) {
                for (let i = 0; i < ring.count; i++) {
                    const angle = (i / ring.count) * Math.PI * 2 + ring.rot;
                    const px = cx + Math.cos(angle) * ring.radius;
                    const py = cy + Math.sin(angle) * ring.radius;
                    const petalRot = angle + Math.PI / 2;
                    const textRot = normalizeRot(petalRot);
                    const step = 4.5;
                    const rowStep = 10;
                    for (let ly = -ring.ph; ly <= ring.ph; ly += rowStep) {
                        for (let lx = -ring.pw; lx <= ring.pw; lx += step) {
                            const cos = Math.cos(petalRot), sin = Math.sin(petalRot);
                            const wx = px + lx * cos - ly * sin;
                            const wy = py + lx * sin + ly * cos;
                            if (pointInEllipse(wx, wy, px, py, ring.pw, ring.ph, petalRot)) {
                                const dist = Math.hypot(lx, ly) / ring.ph;
                                addGlyph(glyphs, wx, wy, nextChar(), lerpColor(ring.colorA, ring.colorB, Math.min(1, dist)), 10 * f.scale, textRot);
                            }
                        }
                    }
                }
            }
        }

        function buildPeonyPetals(glyphs, cx, cy, f) {
            const baseR = 60 * f.scale;
            const rings = [
                { count: 7, radius: baseR * 0.80, pw: baseR * 0.70, ph: baseR * 0.85, rot: 0, colorA: '#fbcfe8', colorB: '#f9a8d4' },
                { count: 6, radius: baseR * 0.55, pw: baseR * 0.55, ph: baseR * 0.65, rot: 0.5, colorA: '#f9a8d4', colorB: '#ec4899' },
                { count: 5, radius: baseR * 0.30, pw: baseR * 0.35, ph: baseR * 0.45, rot: 0.9, colorA: '#ec4899', colorB: '#be185d' },
            ];
            for (const ring of rings) {
                for (let i = 0; i < ring.count; i++) {
                    const angle = (i / ring.count) * Math.PI * 2 + ring.rot;
                    const px = cx + Math.cos(angle) * ring.radius;
                    const py = cy + Math.sin(angle) * ring.radius;
                    const petalRot = angle + Math.PI / 2;
                    const textRot = normalizeRot(petalRot);
                    const step = 4.5;
                    const rowStep = 9;
                    for (let ly = -ring.ph; ly <= ring.ph; ly += rowStep) {
                        for (let lx = -ring.pw; lx <= ring.pw; lx += step) {
                            const cos = Math.cos(petalRot), sin = Math.sin(petalRot);
                            const wx = px + lx * cos - ly * sin;
                            const wy = py + lx * sin + ly * cos;
                            if (pointInEllipse(wx, wy, px, py, ring.pw, ring.ph, petalRot)) {
                                const dist = Math.hypot(lx, ly) / ring.ph;
                                addGlyph(glyphs, wx, wy, nextChar(), lerpColor(ring.colorA, ring.colorB, Math.min(1, dist)), 8.5 * f.scale, textRot);
                            }
                        }
                    }
                }
            }
        }

        function buildLilyPetals(glyphs, cx, cy, f) {
            const petalLen = 55 * f.scale, petalW = 15 * f.scale;
            for (let i = 0; i < 6; i++) {
                const petalRot = (i / 6) * Math.PI * 2 - Math.PI / 2;
                const textRot = normalizeRot(petalRot);
                const step = 4.5;
                const rowStep = 10;
                for (let ly = -petalW; ly <= petalW; ly += rowStep) {
                    for (let lx = 0; lx <= petalLen; lx += step) {
                        const cos = Math.cos(petalRot), sin = Math.sin(petalRot);
                        const wx = cx + lx * cos - ly * sin;
                        const wy = cy + lx * sin + ly * cos;
                        const centeredX = lx - petalLen * 0.6;
                        if ((centeredX*centeredX)/((petalLen*0.6)*(petalLen*0.6)) + (ly*ly)/(petalW*petalW) <= 1) {
                            const t = lx / petalLen;
                            addGlyph(glyphs, wx, wy, nextChar(), lerpColor('#fff8e7', '#d4a574', t), 9 * f.scale, textRot);
                        }
                    }
                }
            }
            for (let y = cy - 5; y <= cy + 5; y += 5) {
                for (let x = cx - 5; x <= cx + 5; x += 4) {
                    if (pointInEllipse(x, y, cx, cy, 5 * f.scale, 5 * f.scale)) {
                        addGlyph(glyphs, x, y, nextChar(), '#F2D46F', 8 * f.scale);
                    }
                }
            }
        }

        function buildDaisyPetals(glyphs, cx, cy, f) {
            const petalLen = 32 * f.scale, petalW = 9 * f.scale;
            const petalColors = ['#F2D46F', '#fb7185', '#e5e7eb'];
            const petalColor = petalColors[Math.floor((cx + cy) % 3)] || '#F2D46F';
            for (let i = 0; i < 8; i++) {
                const petalRot = (i / 8) * Math.PI * 2;
                const textRot = normalizeRot(petalRot);
                const step = 4;
                const rowStep = 8;
                for (let ly = -petalW; ly <= petalW; ly += rowStep) {
                    for (let lx = 0; lx <= petalLen; lx += step) {
                        const cos = Math.cos(petalRot), sin = Math.sin(petalRot);
                        const wx = cx + lx * cos - ly * sin;
                        const wy = cy + lx * sin + ly * cos;
                        const centeredX = lx - petalLen * 0.6;
                        if ((centeredX*centeredX)/((petalLen*0.6)*(petalLen*0.6)) + (ly*ly)/(petalW*petalW) <= 1) {
                            addGlyph(glyphs, wx, wy, nextChar(), petalColor, 8 * f.scale, textRot);
                        }
                    }
                }
            }
            for (let y = cy - 7; y <= cy + 7; y += 6) {
                for (let x = cx - 7; x <= cx + 7; x += 4) {
                    if (pointInEllipse(x, y, cx, cy, 7 * f.scale, 7 * f.scale)) {
                        addGlyph(glyphs, x, y, nextChar(), '#b45309', 8 * f.scale);
                    }
                }
            }
        }

        function buildTulipPetals(glyphs, cx, cy, f, variant) {
            const palettes = {
                pink:  { light: '#fbcfe8', dark: '#db2777' },
                peach: { light: '#fed7aa', dark: '#ea580c' },
                red:   { light: '#fecaca', dark: '#dc2626' },
            };
            const pal = palettes[variant] || palettes.pink;
            const pw = 14 * f.scale;
            const ph = 45 * f.scale;
            const petals = [
                { px: cx - 10 * f.scale, py: cy + 6 * f.scale, rot: -0.32 },
                { px: cx,                py: cy,               rot: 0     },
                { px: cx + 10 * f.scale, py: cy + 6 * f.scale, rot: 0.32  },
            ];
            for (const p of petals) {
                const textRot = normalizeRot(p.rot);
                const step = 4.5;
                const rowStep = 9;
                for (let ly = -ph; ly <= ph; ly += rowStep) {
                    for (let lx = -pw; lx <= pw; lx += step) {
                        const cos = Math.cos(p.rot), sin = Math.sin(p.rot);
                        const wx = p.px + lx * cos - ly * sin;
                        const wy = p.py + lx * sin + ly * cos;
                        if (pointInEllipse(wx, wy, p.px, p.py, pw, ph, p.rot)) {
                            const t = (ly + ph) / (ph * 2);
                            addGlyph(glyphs, wx, wy, nextChar(), lerpColor(pal.light, pal.dark, t), 8 * f.scale, textRot);
                        }
                    }
                }
            }
        }

        function buildBudGlyphs(glyphs, cx, cy, f) {
            const r = 12 * f.scale;
            for (let y = cy - r*1.2; y <= cy + r*1.2; y += 8) {
                for (let x = cx - r*0.8; x <= cx + r*0.8; x += 4) {
                    if (pointInEllipse(x, y, cx, cy, r*0.8, r*1.2)) {
                        const t = (y - (cy - r*1.2)) / (r*2.4);
                        addGlyph(glyphs, x, y, nextChar(), lerpColor('#fef3c7', '#d4a574', t), 8 * f.scale);
                    }
                }
            }
        }

        // LOTV: arching stalk + hanging bells + lance leaves
        function buildLOTV(glyphs, bx, by, tx, ty, f) {
            for (let li = 0; li < 2; li++) {
                const side = li === 0 ? -1 : 1;
                const leafAngle = side * 0.35;
                const leafLen = 95 * f.scale;
                const leafW = 22 * f.scale;
                const leafBaseX = bx + side * 8 * f.scale;
                const leafBaseY = by - 5;
                const leafTipX = leafBaseX + Math.sin(leafAngle) * leafLen;
                const leafTipY = leafBaseY - Math.cos(leafAngle) * leafLen;
                const perpX = Math.cos(leafAngle);
                const perpY = Math.sin(leafAngle);
                for (let t = 0; t <= 1; t += 0.025) {
                    const px = leafBaseX + (leafTipX - leafBaseX) * t;
                    const py = leafBaseY + (leafTipY - leafBaseY) * t;
                    const width = leafW * Math.sin(t * Math.PI) * 0.5;
                    for (let d = -width; d <= width; d += 4.5) {
                        addGlyph(glyphs, px + perpX * d, py + perpY * d, nextChar(), lerpColor('#5c8a3c', '#2f5d3a', t), 8 * f.scale, leafAngle);
                    }
                }
            }

            const ctrlX = bx + (tx - bx) * 0.35;
            const ctrlY = by - (by - ty) * 0.95;
            const bezierPoint = (t) => {
                const x = (1-t)*(1-t)*bx + 2*(1-t)*t*ctrlX + t*t*tx;
                const y = (1-t)*(1-t)*by + 2*(1-t)*t*ctrlY + t*t*ty;
                return { x, y };
            };
            const stalkW = 2.4 * f.scale;
            for (let t = 0; t <= 1; t += 0.012) {
                const pt = bezierPoint(t);
                for (let d = -stalkW; d <= stalkW; d += 2.8 * f.scale) {
                    addGlyph(glyphs, pt.x + d, pt.y, nextChar(), lerpColor('#4a7030', '#5c8a3c', t), 7 * f.scale);
                }
            }

            const bellCount = 7;
            for (let i = 0; i < bellCount; i++) {
                const t = 0.55 + (i / (bellCount - 1)) * 0.42;
                const pt = bezierPoint(t);
                const sideOffset = (i % 2 === 0 ? -1 : 1) * 3 * f.scale;
                const bellX = pt.x + sideOffset;
                const pedicelLen = 8 * f.scale;
                const bellY = pt.y + pedicelLen;

                for (let py = pt.y; py <= bellY; py += 4) {
                    addGlyph(glyphs, pt.x, py, nextChar(), '#7FA070', 6 * f.scale);
                }

                const bellH = 13 * f.scale;
                const bellW = 6 * f.scale;
                for (let bOffset = 0; bOffset <= bellH; bOffset += 6 * f.scale) {
                    const y2 = bellY + bOffset;
                    const prog = bOffset / bellH;
                    const width = bellW * (0.4 + 0.6 * prog);
                    for (let bx2 = -width; bx2 <= width; bx2 += 4 * f.scale) {
                        const scallop = prog > 0.85 ? Math.sin(bx2 / width * Math.PI * 3) * 1.5 : 0;
                        addGlyph(glyphs, bellX + bx2, y2 + scallop, nextChar(), lerpColor('#ffffff', '#d1d5db', prog), 6.5 * f.scale);
                    }
                }
            }
        }

        function buildGlyphLayout() {
            const W = window.innerWidth, H = window.innerHeight;
            const glyphs = [];
            _phraseCursor = 0;
            for (const f of FLOWERS) {
                const bx = f.baseX * W, by = f.baseY * H;
                const tx = f.topX * W, ty = f.topY * H;
                buildStemGlyphs(glyphs, bx, by, tx, ty, f);
                if (f.type === 'lotv') {
                    buildLOTV(glyphs, bx, by, tx, ty, f);
                } else {
                    buildLeafGlyphs(glyphs, bx, by, tx, ty, f);
                    buildBudGlyphs(glyphs, tx, ty, f);
                    if (f.type === 'rose')        buildRosePetals(glyphs, tx, ty, f);
                    else if (f.type === 'peony')  buildPeonyPetals(glyphs, tx, ty, f);
                    else if (f.type === 'lily')   buildLilyPetals(glyphs, tx, ty, f);
                    else if (f.type === 'daisy')  buildDaisyPetals(glyphs, tx, ty, f);
                    else if (f.type === 'tulip')  buildTulipPetals(glyphs, tx, ty, f, f.variant);
                }
            }
            return glyphs;
        }

        function resizeCanvas() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = window.innerWidth, h = window.innerHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            canvas.style.width = w + 'px';
            canvas.style.height = h + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function initCache() {
            const W = window.innerWidth, H = window.innerHeight;
            cachedCanvas = document.createElement('canvas');
            cachedCanvas.width = W * dpr;
            cachedCanvas.height = H * dpr;
            cachedCtx = cachedCanvas.getContext('2d');
            cachedCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
            cachedCtx.textBaseline = 'top';
        }

        function drawGlyphTo(targetCtx, g) {
            targetCtx.fillStyle = g.color;
            targetCtx.font = getFont(g.fontSize);
            if (g.rotation === 0) {
                targetCtx.fillText(g.char, g.x, g.y);
            } else {
                targetCtx.save();
                targetCtx.translate(g.x, g.y);
                targetCtx.rotate(g.rotation);
                targetCtx.fillText(g.char, 0, 0);
                targetCtx.restore();
            }
        }

        function drawGlyphFading(g) {
            ctx.globalAlpha = g.alpha;
            ctx.fillStyle = g.color;
            ctx.font = getFont(g.fontSize);
            if (g.rotation === 0) {
                ctx.fillText(g.char, g.x, g.y);
            } else {
                ctx.save();
                ctx.translate(g.x, g.y);
                ctx.rotate(g.rotation);
                ctx.fillText(g.char, 0, 0);
                ctx.restore();
            }
            ctx.globalAlpha = 1;
        }

        function drawAllFlowers(progress, isFinal) {
            if (!cachedCtx) initCache();
            const W = window.innerWidth, H = window.innerHeight;
            const revealY = H * (1 - easeOutQuad(progress));

            for (const g of allGlyphs) {
                if (g.cached) continue;
                const effY = g.y + g.randomOffset;
                if (isFinal || (effY - revealY) > FADE_DISTANCE) {
                    drawGlyphTo(cachedCtx, g);
                    g.cached = true;
                }
            }

            ctx.clearRect(0, 0, W, H);
            ctx.drawImage(cachedCanvas, 0, 0, W, H);

            for (const g of allGlyphs) {
                if (g.cached) continue;
                const effY = g.y + g.randomOffset;
                if (isFinal) {
                    g.alpha = 1;
                    drawGlyphFading(g);
                } else if (effY >= revealY) {
                    g.alpha = smoothstep((effY - revealY) / FADE_DISTANCE);
                    drawGlyphFading(g);
                }
            }
        }

        function tick(now) {
            if (!heartSequenceRunning || !growthStartTime) return;
            const elapsed = now - growthStartTime;
            const progress = Math.min(1, elapsed / GROWTH_DURATION);
            drawAllFlowers(progress, progress >= 1);
            if (progress < 1) {
                canvasAnimRAF = requestAnimationFrame(tick);
            } else {
                canvasAnimRAF = 0;
            }
        }

                if (!reduced()) {
                    const opts = { duration: 640, easing: 'cubic-bezier(0.65, 0, 0.25, 1)' };
                    const out = scene.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(100%)' }], Object.assign({ fill: 'forwards' }, opts));
                    const back = stage3.animate([{ transform: 'translateX(-100%)' }, { transform: 'translateX(0)' }], opts);
                    await Promise.all([fin(out), fin(back)]); out.cancel();
                }
                resetScene(); stage3.inert = false; isLetterOpen = false; busy = false; window.__s3busy = false; trigger.focus({ preventScroll: true });
            }
            trigger.addEventListener('click', openLetter);
            trigger.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLetter(); } });
            closeBtn.addEventListener('click', closeLetter);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && isLetterOpen) closeLetter(); });
        })();

        // ================= CAMERA =================
        (function () {
            const $ = (id) => document.getElementById(id);
            const cameraTrigger = $('camera-trigger'), cameraModal = $('camera-modal'), cameraUi = cameraModal.querySelector('.camera-ui');
            const closeCameraBtn = $('close-camera-btn'), videoElement = $('camera-video'), canvasElement = $('camera-canvas');
            const captureBtn = $('capture-btn'), switchBtn = $('switch-camera-btn'), cameraError = $('camera-error-msg');
            const cameraControls = $('camera-controls'), flashOverlay = $('flash-overlay');
            const previewContainer = $('preview-container'), capturedImage = $('captured-image');
            const retakeBtn = $('retake-btn'), saveBtn = $('save-btn'), saveToast = $('save-toast');
            const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            if (typeof window.__s3busy === 'undefined') window.__s3busy = false;
            const vf = $('viewfinder');
            function showBrackets(el) {
                const r = el.getBoundingClientRect(), pad = 14;
                Object.assign(vf.style, { left: (r.left - pad) + 'px', top: (r.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px', visibility: 'visible' });
                return vf.animate([{ opacity: 0, transform: 'scale(1.35)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 240, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'forwards' });
            }
            function hideBrackets() {
                vf.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 180, fill: 'forwards' }).finished.then(() => { vf.style.visibility = 'hidden'; vf.getAnimations().forEach((a) => a.cancel()); }).catch(() => {});
            }
            const FILTERS = { warm: 'sepia(0.3) contrast(1.1) brightness(1.05) saturate(0.8) hue-rotate(-5deg)', vintage: 'sepia(0.4) contrast(0.9) brightness(1.1) saturate(0.6)', pink: 'sepia(0.2) contrast(1.1) brightness(1.1) saturate(0.9) hue-rotate(-15deg)', film: 'sepia(0.2) contrast(1.2) brightness(0.95) saturate(1.2)', bw: 'grayscale(1) contrast(1.2) brightness(1.1)' };
            let currentFilter = FILTERS.warm;
            let stream = null, facingMode = 'environment', startToken = 0;
            const filterPresets = document.querySelectorAll('.preset-btn');
            filterPresets.forEach((btn) => {
                btn.setAttribute('aria-pressed', btn.classList.contains('active') ? 'true' : 'false');
                btn.addEventListener('click', () => {
                    filterPresets.forEach((b) => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
                    btn.classList.add('active'); btn.setAttribute('aria-pressed', 'true');
                    currentFilter = FILTERS[btn.getAttribute('data-filter')] || FILTERS.warm;
                    videoElement.style.filter = currentFilter;
                });
            });
            function showCameraError(html) {
                cameraError.innerHTML = html + '<br><button type="button" class="retry-btn" id="camera-retry" style="margin-top:14px;padding:9px 20px;border-radius:24px;background:var(--surface);color:var(--main-red);border:2px solid var(--accent-gold);font-family:Fredoka;font-weight:600;cursor:pointer;">Try again</button>';
                cameraError.style.display = 'block'; cameraControls.style.display = 'none';
                const retry = $('camera-retry'); if (retry) retry.addEventListener('click', startCamera);
            }
            function stopCamera() { startToken++; if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; } videoElement.srcObject = null; }
            async function startCamera() {
                const token = ++startToken;
                if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
                cameraError.style.display = 'none';
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showCameraError(window.isSecureContext === false ? 'The camera needs a secure (https) connection.' : 'This browser does not support camera access.'); return; }
                try {
                    const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facingMode } }, audio: false });
                    if (token !== startToken || !cameraModal.classList.contains('active')) { s.getTracks().forEach((t) => t.stop()); return; }
                    stream = s; videoElement.srcObject = s; videoElement.style.filter = currentFilter;
                    cameraControls.style.display = 'flex';
                    try { await videoElement.play(); } catch (e) {}
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    switchBtn.style.display = devices.filter((d) => d.kind === 'videoinput').length > 1 ? 'flex' : 'none';
                } catch (err) {
                    if (token !== startToken) return;
                    if (err.name === 'NotAllowedError' || err.name === 'SecurityError') { showCameraError('Camera permission denied.<br>Please allow access in your browser settings.'); }
                    else if (err.name === 'NotFoundError' || err.name === 'OverconstrainedError') { showCameraError('No camera found on this device.'); }
                    else { showCameraError('Unable to access camera.<br>Please check your device.'); }
                }
            }
            function resetCameraUi() { previewContainer.classList.remove('active'); videoElement.style.display = 'block'; cameraError.style.display = 'none'; cameraControls.style.display = 'flex'; videoElement.style.filter = currentFilter; }
            async function openCamera() {
                if (window.__s3busy || cameraModal.classList.contains('active')) return; window.__s3busy = true;
                if (!reduced()) { cameraTrigger.querySelector('svg').animate([{ transform: 'scale(1)' }, { transform: 'scale(0.9)' }, { transform: 'scale(1.03)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'ease-out' }); showBrackets(cameraTrigger); await wait(330); }
                resetCameraUi();
                const cr = cameraTrigger.getBoundingClientRect(), ur = cameraUi.getBoundingClientRect();
                cameraUi.style.transformOrigin = (cr.left + cr.width / 2 - ur.left) + 'px ' + (cr.top + cr.height / 2 - ur.top) + 'px';
                cameraModal.classList.add('active'); hideBrackets(); window.__s3busy = false;
                startCamera(); closeCameraBtn.focus({ preventScroll: true });
            }
            function closeCamera() { stopCamera(); cameraModal.classList.remove('active'); cameraTrigger.focus({ preventScroll: true }); }
            cameraTrigger.addEventListener('click', (e) => { e.preventDefault(); openCamera(); });
            closeCameraBtn.addEventListener('click', closeCamera);
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && cameraModal.classList.contains('active')) closeCamera(); });
            document.addEventListener('visibilitychange', () => { if (!cameraModal.classList.contains('active')) return; if (document.hidden) stopCamera(); else if (!previewContainer.classList.contains('active')) startCamera(); });
            switchBtn.addEventListener('click', () => { facingMode = facingMode === 'environment' ? 'user' : 'environment'; startCamera(); });
            captureBtn.addEventListener('click', () => {
                if (!stream || !videoElement.videoWidth) return;
                if (!reduced()) { flashOverlay.animate([{ opacity: 0 }, { opacity: 0.55, offset: 0.18 }, { opacity: 0 }], { duration: 420, easing: 'ease-out' }); }
                const width = videoElement.videoWidth, height = videoElement.videoHeight;
                canvasElement.width = width; canvasElement.height = height;
                const c2d = canvasElement.getContext('2d');
                c2d.filter = currentFilter; c2d.drawImage(videoElement, 0, 0, width, height); c2d.filter = 'none';
                const gradient = c2d.createRadialGradient(width / 2, height / 2, width / 4, width / 2, height / 2, width / 1.5);
                gradient.addColorStop(0, 'rgba(0,0,0,0)'); gradient.addColorStop(1, 'rgba(0,0,0,0.45)');
                c2d.fillStyle = gradient; c2d.fillRect(0, 0, width, height);
                capturedImage.src = canvasElement.toDataURL('image/jpeg', 0.92);
                videoElement.style.display = 'none';
                previewContainer.classList.add('active');
            });
            retakeBtn.addEventListener('click', () => { previewContainer.classList.remove('active'); videoElement.style.display = 'block'; capturedImage.removeAttribute('src'); });
            saveBtn.addEventListener('click', async () => {
                try {
                    const blob = await new Promise((res) => canvasElement.toBlob(res, 'image/jpeg', 0.92));
                    if (!blob) throw new Error('no blob');
                    const file = new File([blob], 'memory-' + Date.now() + '.jpg', { type: 'image/jpeg' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Memory' }); }
                    else { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }
                    saveToast.textContent = 'Saved!'; saveToast.classList.add('show'); setTimeout(() => saveToast.classList.remove('show'), 2200);
                } catch (e) {
                    saveToast.textContent = 'Long-press the image to save.'; saveToast.classList.add('show'); setTimeout(() => saveToast.classList.remove('show'), 2600);
                }
            });
        })();

        // ================= MEMORIES GALLERY =================
        (function () {
            const $ = (id) => document.getElementById(id);
            const galleryBtn = $('gallery-btn');
            const finalScene = $('final-scene');
            const shutter = $('shutter');
            const polaroids = Array.from(finalScene.querySelectorAll('.polaroid'));
            const first = polaroids[0];
            const wait = (ms) => new Promise((r) => setTimeout(r, ms));
            const fin = (a) => a.finished.catch(() => {});
            async function openMemories() {
                if (window.__s3busy) return;
                window.__s3busy = true;
                const vw = window.innerWidth, vh = window.innerHeight;
                shutter.classList.add('on'); await wait(80);
                stage3.classList.remove('show');
                document.body.classList.add('show-final-scene');
                finalScene.style.zIndex = '9999999997';
                polaroids.forEach((p) => p.classList.add('mem-hide'));
                const dark = document.createElement('div');
                dark.style.cssText = 'position:fixed;inset:0;background:#0c0505;z-index:9999999998;opacity:1;pointer-events:none;';
                document.body.appendChild(dark);
                const fr = first.getBoundingClientRect();
                const cx = fr.left + fr.width / 2, cy = fr.top + fr.height / 2;
                const flyer = first.cloneNode(true);
                flyer.classList.remove('mem-hide', 'mem-in'); flyer.classList.add('mem-flyer');
                flyer.style.cssText = 'position:fixed;left:' + fr.left + 'px;top:' + fr.top + 'px;width:' + fr.width + 'px;height:' + fr.height + 'px;margin:0;z-index:9999999999;pointer-events:none;transform-origin:center center;';
                document.body.appendChild(flyer);
                await wait(20);
                try { await flyer.querySelector('img').decode(); } catch (e) {}
                const endTransform = getComputedStyle(first).transform;
                const fly = flyer.animate([{ transform: 'translate(' + (vw / 2 - cx) + 'px, ' + (vh / 2 - cy) + 'px) scale(0.42) rotate(-7deg)', opacity: 0 }, { opacity: 1, offset: 0.18 }, { transform: endTransform === 'none' ? 'none' : endTransform, opacity: 1 }], { duration: 860, easing: 'cubic-bezier(0.22, 0.8, 0.24, 1)', fill: 'forwards' });
                const lift = dark.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 650, delay: 110, easing: 'ease-out', fill: 'forwards' });
                await wait(450);
                polaroids.slice(1).forEach((p, i) => { p.style.setProperty('--d', (Math.min(i, 5) * 90) + 'ms'); p.classList.remove('mem-hide'); p.classList.add('mem-in'); });
                await fin(fly);
                first.classList.remove('mem-hide');
                flyer.remove();
                await fin(lift);
                shutter.classList.remove('on');
                dark.getAnimations().forEach((a) => a.cancel());
                setTimeout(() => { dark.remove(); polaroids.forEach((p) => { p.classList.remove('mem-in'); p.style.removeProperty('--d'); }); }, 1600);
                window.__s3busy = false;
            }
            galleryBtn.addEventListener('click', openMemories);
        })();

        // ================= MOBILE SIMULATOR =================
        (function () {
            if (window.top !== window.self) document.documentElement.classList.add('in-sim');
            const openSimBtn = document.getElementById('openSimBtn');
            const closeSimBtn = document.getElementById('closeSimBtn');
            const sim = document.getElementById('mobile-simulator');
            const iframe = document.getElementById('sim-iframe');
            if (!openSimBtn || !closeSimBtn || !sim || !iframe) return;
            const frame = sim.querySelector('.phone-frame');
            const W = 390, H = 844;
            function fit() {
                const scale = Math.min(1, (window.innerHeight - 96) / (H + 24), (window.innerWidth - 24) / (W + 24));
                frame.style.setProperty('--sim-scale', Math.max(0.2, scale).toFixed(3));
            }
            function snapshot() {
                const clone = document.documentElement.cloneNode(true);
                clone.classList.add('in-sim');
                ['mobile-simulator', 'openSimBtn'].forEach((id) => { const n = clone.querySelector('#' + id); if (n) n.remove(); });
                ['camera-modal', 'letter-scene'].forEach((id) => { const n = clone.querySelector('#' + id); if (n) n.classList.remove('active', 'reading', 'settled'); });
                const shutter = clone.querySelector('#shutter'); if (shutter) shutter.classList.remove('on');
                return '<!DOCTYPE html>' + clone.outerHTML;
            }
            function openSim() { fit(); iframe.srcdoc = snapshot(); sim.classList.add('active'); requestAnimationFrame(() => requestAnimationFrame(() => sim.classList.add('visible'))); closeSimBtn.focus({ preventScroll: true }); }
            function closeSim() { if (!sim.classList.contains('active')) return; sim.classList.remove('visible'); setTimeout(() => { sim.classList.remove('active'); iframe.removeAttribute('srcdoc'); iframe.src = 'about:blank'; }, 260); openSimBtn.focus({ preventScroll: true }); }
            openSimBtn.addEventListener('click', openSim);
            closeSimBtn.addEventListener('click', closeSim);
            sim.addEventListener('click', (e) => { if (e.target === sim) closeSim(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSim(); });
            window.addEventListener('resize', fit);
        })();
    </script>
</body>
