<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Baby</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAE6DF;
            --surface: #F2EDE4;
            --butter: #F2D46F;
            --blush: #F2B2BE;
            --deep-pink: #D96E88;
            --cocoa: #593E3A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            font-family: 'Nunito', sans-serif;
            color: var(--cocoa);
            display: flex;
            min-height: 100vh;
            overflow: hidden; 
        }

        /* --- SANDEVISTAN HEART CONTAINER --- */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; 
            z-index: 0;
        }

        /* The whole falling object wrapper */
        .falling-entity {
            position: absolute;
            /* Slower, smoother fall */
            animation: fallAndRotate linear infinite;
        }

        /* --- THE GREEN/CYAN SQUARE TRAILS --- */
        .trail-square {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 2px;
            /* Glowing neon effect */
            box-shadow: 0 0 8px currentColor, inset 0 0 4px rgba(255,255,255,0.5);
            border: 1px solid rgba(255, 255, 255, 0.4);
            /* Position them exactly over the heart, but they will be offset via JS */
        }

        /* Colors matching the image's chromatic aberration */
        .trail-1 { color: #00FF66; background: #00FF66; opacity: 0.8; } /* Neon Green */
        .trail-2 { color: #00FFFF; background: #00FFFF; opacity: 0.6; } /* Cyan */
        .trail-3 { color: #0088FF; background: #0088FF; opacity: 0.4; } /* Blue */
        .trail-4 { color: #8A2BE2; background: #8A2BE2; opacity: 0.2; } /* Purple */

        /* --- THE YELLOW HEART --- */
        .sandevistan-heart {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--butter);
            transform: rotate(45deg);
            box-shadow: 0 0 10px var(--butter);
            border-radius: 2px;
            z-index: 10; /* Keep heart on top of trails */
        }

        .sandevistan-heart::before,
        .sandevistan-heart::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--butter);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--butter);
        }

        .sandevistan-heart::before { top: -7px; left: 0; }
        .sandevistan-heart::after { top: 0; left: -7px; }

        /* The Falling Animation */
        @keyframes fallAndRotate {
            0% {
                top: -10vh;
                /* Base 45deg rotation for the heart, plus 360 degree spin */
                transform: rotate(45deg) rotateZ(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 110vh;
                transform: rotate(45deg) rotateZ(360deg);
                opacity: 0;
            }
        }
        /* ------------------------------ */

        /* Main Area */
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            width: 100%;
            z-index: 2; 
        }

        /* Top Progress Bar */
        .header {
            width: 90%;
            max-width: 800px;
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.05), -6px -6px 12px rgba(255,255,255,0.8);
            margin-bottom: 50px;
            margin-top: 20px;
        }

        .progress-text {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            flex: 1;
            text-align: center;
        }

        .progress-bar {
            width: 30%;
            height: 12px;
            background: #e0d8cd;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--deep-pink);
            border-radius: 10px;
        }

        .score {
            font-weight: 800;
            color: var(--deep-pink);
            margin-left: 20px;
        }

        /* Center Hero Blob */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .blob {
            background: var(--blush);
            padding: 60px 50px;
            border-radius: 46% 54% 48% 52% / 55% 43% 57% 45%; 
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.1), 
                -10px -10px 20px rgba(255,255,255,0.8),
                inset -5px -5px 15px rgba(217, 110, 136, 0.2),
                inset 5px 5px 15px rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 40px;
            animation: float 6s ease-in-out infinite;
            max-width: 90vw;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .blob h1 {
            font-family: 'Caveat', cursive;
            font-size: 65px;
            color: var(--cocoa);
            margin-bottom: 15px;
            line-height: 0.9;
        }

        .blob p {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            color: var(--cocoa);
            font-weight: 600;
            margin-top: 15px;
        }

        /* Start Button */
        .start-btn {
            background: var(--butter);
            color: var(--cocoa);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 600;
            padding: 20px 50px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 
                6px 6px 15px rgba(0,0,0,0.1), 
                -6px -6px 15px rgba(255,255,255,0.8),
                inset -3px -3px 8px rgba(200, 160, 50, 0.3),
                inset 3px 3px 8px rgba(255,255,255,0.8);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .start-btn:active {
            box-shadow: 
                inset 6px 6px 10px rgba(200, 160, 50, 0.4),
                inset -6px -6px 10px rgba(255,255,255,0.8);
            transform: translateY(2px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .blob { padding: 50px 30px; }
            .blob h1 { font-size: 50px; }
            .blob p { font-size: 22px; }
            .progress-bar { display: none; }
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .score { margin-left: 0; }
        }
    </style>
</head>
<body>

    <div id="heart-container"></div>

    <div class="main-content">
        <div class="header">
            <span class="progress-text">TIP: you should click that button that says start now 😉</span>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <span class="score">0 / 15</span>
        </div>

        <div class="hero">
            <div class="blob">
                <h1>HAPPY BIRTHDAY<br>BABY</h1>
                <p>ingredients are love, code, and ambot👁️👁️</p>
            </div>
            
            <button class="start-btn">
                Start Now ➔
            </button>
        </div>
    </div>

    <script>
        const container = document.getElementById('heart-container');
        
        function createEntity() {
            const entity = document.createElement('div');
            entity.classList.add('falling-entity');
            
            // Slow down the fall time (3 to 5 seconds per drop)
            const duration = Math.random() * 2 + 3.5; 
            entity.style.animationDuration = duration + 's';
            
            // Randomize horizontal position
            entity.style.left = Math.random() * 100 + 'vw';

            // 1. Create the glowing square trails (Behind the heart)
            // We offset them slightly so they look like afterimages echoing backwards
            const offsets = [
                { class: 'trail-1', x: 0, y: 20 },  // Green
                { class: 'trail-2', x: 0, y: 40 },  // Cyan
                { class: 'trail-3', x: 0, y: 60 },  // Blue
                { class: 'trail-4', x: 0, y: 80 }   // Purple
            ];

            offsets.forEach(offset => {
                const trail = document.createElement('div');
                trail.classList.add('trail-square', offset.class);
                // Offset the trail directly below the heart to simulate the path it just took
                trail.style.transform = `translate(${offset.x}px, ${offset.y}px) rotate(45deg)`;
                entity.appendChild(trail);
            });

            // 2. Create the Yellow Heart on top
            const heart = document.createElement('div');
            heart.classList.add('sandevistan-heart');
            // Add a subtle wobble scale
            const scale = Math.random() * 0.5 + 0.8;
            heart.style.transform = `rotate(45deg) scale(${scale})`;
            entity.appendChild(heart);

            container.appendChild(entity);
            
            // Remove after it finishes falling
            setTimeout(() => {
                entity.remove();
            }, duration * 1000);
        }

        // Spawn a heart every 400ms (much slower and less dizzying)
        setInterval(createEntity, 400);
    </script>
</body>
</html>
