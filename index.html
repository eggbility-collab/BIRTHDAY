<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Baby</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #EAE6DF;
            --surface: #F2EDE4;
            --butter: #F2D46F;
            --blush: #F2B2BE;
            --deep-pink: #D96E88;
            --cocoa: #593E3A;
            --sandevistan: #FFE55C; /* Cyberpunk Yellow */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            font-family: 'Nunito', sans-serif;
            color: var(--cocoa);
            display: flex;
            min-height: 100vh;
            overflow: hidden; 
        }

        /* --- SANDEVISTAN HEARTS CSS --- */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; 
            z-index: 0;
            /* Slight chromatic aberration on the whole container for that cyberpunk feel */
            filter: contrast(1.1) saturate(1.2);
        }

        .sandevistan-heart {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--sandevistan);
            transform: rotate(45deg);
            /* The glowing core */
            box-shadow: 0 0 10px var(--sandevistan), 0 0 20px var(--sandevistan);
            animation: dash linear infinite;
            border-radius: 2px;
        }

        /* Heart shape */
        .sandevistan-heart::before,
        .sandevistan-heart::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--sandevistan);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--sandevistan);
        }

        .sandevistan-heart::before {
            top: -6px;
            left: 0;
        }

        .sandevistan-heart::after {
            top: 0;
            left: -6px;
        }

        /* The Sandevistan Trail */
        .sandevistan-heart .trail {
            position: absolute;
            top: -100px; /* Length of the trail */
            left: 4px; /* Center of the heart */
            width: 4px;
            height: 100px;
            background: linear-gradient(to top, rgba(255, 229, 92, 0.9), rgba(255, 229, 92, 0));
            filter: blur(2px);
            border-radius: 50%;
        }

        /* The Afterimages / Speed lines */
        .sandevistan-heart .trail::before,
        .sandevistan-heart .trail::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: inherit;
        }

        .sandevistan-heart .trail::before {
            left: -3px;
            filter: blur(4px);
            opacity: 0.7;
            background: linear-gradient(to top, rgba(255, 255, 255, 0.8), rgba(255, 255, 255, 0));
        }

        .sandevistan-heart .trail::after {
            left: 3px;
            filter: blur(6px);
            opacity: 0.5;
            background: linear-gradient(to top, rgba(217, 110, 136, 0.8), rgba(217, 110, 136, 0));
        }

        @keyframes dash {
            0% {
                top: -20vh;
                opacity: 0;
                transform: rotate(45deg) scale(1);
            }
            10% {
                opacity: 1;
                /* Slight glitch/speed wobble */
                transform: rotate(45deg) scale(1) translateX(-2px); 
            }
            50% {
                transform: rotate(45deg) scale(1) translateX(2px);
            }
            90% {
                opacity: 1;
            }
            100% {
                top: 120vh;
                opacity: 0;
                transform: rotate(45deg) scale(1) translateY(10px);
            }
        }
        /* ------------------------------ */

        /* Main Area */
        .main-content {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            width: 100%;
            z-index: 2; 
        }

        /* Top Progress Bar */
        .header {
            width: 90%;
            max-width: 800px;
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 6px 6px 12px rgba(0,0,0,0.05), -6px -6px 12px rgba(255,255,255,0.8);
            margin-bottom: 50px;
            margin-top: 20px;
        }

        .progress-text {
            font-family: 'Caveat', cursive;
            font-size: 22px;
            flex: 1;
            text-align: center;
        }

        .progress-bar {
            width: 30%;
            height: 12px;
            background: #e0d8cd;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--deep-pink);
            border-radius: 10px;
        }

        .score {
            font-weight: 800;
            color: var(--deep-pink);
            margin-left: 20px;
        }

        /* Center Hero Blob */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 40px;
        }

        .blob {
            background: var(--blush);
            padding: 60px 50px;
            border-radius: 46% 54% 48% 52% / 55% 43% 57% 45%; 
            box-shadow: 
                10px 10px 20px rgba(0,0,0,0.1), 
                -10px -10px 20px rgba(255,255,255,0.8),
                inset -5px -5px 15px rgba(217, 110, 136, 0.2),
                inset 5px 5px 15px rgba(255,255,255,0.8);
            text-align: center;
            margin-bottom: 40px;
            animation: float 6s ease-in-out infinite;
            max-width: 90vw;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .blob h1 {
            font-family: 'Caveat', cursive;
            font-size: 65px;
            color: var(--cocoa);
            margin-bottom: 15px;
            line-height: 0.9;
        }

        .blob p {
            font-family: 'Caveat', cursive;
            font-size: 26px;
            color: var(--cocoa);
            font-weight: 600;
            margin-top: 15px;
        }

        /* Start Button */
        .start-btn {
            background: var(--butter);
            color: var(--cocoa);
            font-family: 'Fredoka', sans-serif;
            font-size: 24px;
            font-weight: 600;
            padding: 20px 50px;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 
                6px 6px 15px rgba(0,0,0,0.1), 
                -6px -6px 15px rgba(255,255,255,0.8),
                inset -3px -3px 8px rgba(200, 160, 50, 0.3),
                inset 3px 3px 8px rgba(255,255,255,0.8);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .start-btn:active {
            box-shadow: 
                inset 6px 6px 10px rgba(200, 160, 50, 0.4),
                inset -6px -6px 10px rgba(255,255,255,0.8);
            transform: translateY(2px);
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            .blob { padding: 50px 30px; }
            .blob h1 { font-size: 50px; }
            .blob p { font-size: 22px; }
            .progress-bar { display: none; }
            .header { flex-direction: column; gap: 10px; padding: 15px; }
            .score { margin-left: 0; }
        }
    </style>
</head>
<body>

    <!-- The container where JS puts the hearts -->
    <div id="heart-container"></div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Top Bar -->
        <div class="header">
            <span class="progress-text">TIP: you should click that button that says start now 😉</span>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <span class="score">0 / 15</span>
        </div>

        <!-- Center Hero -->
        <div class="hero">
            <div class="blob">
                <h1>HAPPY BIRTHDAY<br>BABY</h1>
                <p>ingredients are love, code, and ambot👁️👁️</p>
            </div>
            
            <button class="start-btn">
                Start Now ➔
            </button>
        </div>

    </div>

    <!-- Sandevistan Heart Generator -->
    <script>
        const container = document.getElementById('heart-container');
        
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('sandevistan-heart');
            
            // Add the trail div inside the heart
            const trail = document.createElement('div');
            trail.classList.add('trail');
            heart.appendChild(trail);

            // Randomize starting position
            heart.style.left = Math.random() * 100 + 'vw';
            
            // Randomize speed (Cyberpunk dash speed)
            const duration = Math.random() * 0.8 + 0.4; // Very fast
            heart.style.animationDuration = duration + 's';
            
            // Randomize size slightly
            const scale = Math.random() * 0.8 + 0.6;
            heart.style.transform = `rotate(45deg) scale(${scale})`;

            container.appendChild(heart);
            
            // Remove heart
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Spawn 1 heart every 60ms for a dense, high-speed visual effect
        setInterval(createHeart, 60);
    </script>
</body>
</html>
