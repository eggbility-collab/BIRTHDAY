<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Scene</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Fredoka:wght@400;600&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-bg: #F7F5F4;
            --main-red: #732624;
            --envelope: #863F3F;
            --letter-paper: #FDFCFB;
            --text-dark: #381413;
            --accent-gold: #D9B46D;
            --subtle-border: #CBBDB9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--page-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Nunito', sans-serif;
            padding: 20px;
        }

        /* The main deep red canvas */
        .main-canvas {
            background-color: var(--main-red);
            width: 100%;
            max-width: 900px;
            height: 80vh;
            min-height: 500px;
            border-radius: 20px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 20px 50px rgba(56, 20, 19, 0.3);
            overflow: hidden;
            border: 8px solid var(--subtle-border);
        }

        /* Scattered little hearts on the red background */
        .bg-heart {
            position: absolute;
            fill: var(--envelope);
            opacity: 0.6;
        }
        .bh-1 { width: 30px; top: 10%; left: 40%; transform: rotate(-15deg); }
        .bh-2 { width: 20px; top: 70%; left: 15%; transform: rotate(25deg); }
        .bh-3 { width: 40px; top: 20%; right: 15%; transform: rotate(15deg); opacity: 0.3; }
        .bh-4 { width: 25px; bottom: 15%; right: 30%; transform: rotate(-10deg); }

        /* The layout holding the 3 main elements */
        .scene-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        /* SVG Container sizes */
        .svg-camera {
            width: 150px;
            height: auto;
            margin-top: 80px; /* Offset to match the image */
        }

        .svg-envelope-wrapper {
            position: relative;
            width: 300px;
            height: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .svg-flowers {
            width: 140px;
            height: auto;
            margin-top: 40px;
        }

        /* "Click Me" text below envelope */
        .click-me {
            font-family: 'Caveat', cursive;
            color: var(--letter-paper);
            font-size: 24px;
            margin-top: 15px;
            letter-spacing: 2px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .scene-container {
                flex-direction: column;
                gap: 0px;
            }
            .svg-camera {
                width: 100px;
                position: absolute;
                bottom: -20px;
                left: 20px;
                margin: 0;
            }
            .svg-envelope-wrapper {
                width: 250px;
            }
            .svg-flowers {
                width: 100px;
                position: absolute;
                bottom: 20px;
                right: 10px;
                margin: 0;
            }
            .main-canvas {
                height: 90vh;
            }
        }
    </style>
</head>
<body>

    <div class="main-canvas">
        
        <!-- Scattered background hearts -->
        <svg class="bg-heart bh-1" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <svg class="bg-heart bh-2" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <svg class="bg-heart bh-3" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <svg class="bg-heart bh-4" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>

        <div class="scene-container">
            
            <!-- 1. The Camera (SVG) -->
            <svg class="svg-camera" viewBox="0 0 200 150" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Shadow -->
                <ellipse cx="100" cy="140" rx="80" ry="10" fill="#381413" opacity="0.3"/>
                <!-- Camera Body -->
                <rect x="20" y="40" width="160" height="90" rx="15" fill="#FDFCFB" stroke="#CBBDB9" stroke-width="4"/>
                <rect x="20" y="40" width="160" height="30" rx="15" fill="#F7F5F4" stroke="#CBBDB9" stroke-width="4"/>
                <!-- Top Flash -->
                <rect x="130" y="20" width="30" height="20" rx="5" fill="#E5DED8" stroke="#CBBDB9" stroke-width="3"/>
                <!-- Lens Outer -->
                <circle cx="100" cy="85" r="35" fill="#E5DED8" stroke="#CBBDB9" stroke-width="4"/>
                <!-- Lens Inner -->
                <circle cx="100" cy="85" r="25" fill="#381413"/>
                <circle cx="95" cy="80" r="8" fill="#FDFCFB" opacity="0.6"/>
                <!-- Red Accents -->
                <rect x="40" y="45" width="40" height="10" rx="5" fill="#863F3F"/>
                <circle cx="160" cy="50" r="5" fill="#863F3F"/>
            </svg>

            <!-- 2. The Envelope (SVG) -->
            <div class="svg-envelope-wrapper">
                <svg class="svg-envelope" viewBox="0 0 300 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Letter sticking out -->
                    <rect x="60" y="30" width="180" height="140" rx="10" fill="#FDFCFB" stroke="#CBBDB9" stroke-width="3"/>
                    <!-- Letter Text (Mock) -->
                    <path d="M90 70 H210 M90 90 H210 M90 110 H170" stroke="#CBBDB9" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Envelope Back -->
                    <path d="M30 100 L270 100 L270 230 L30 230 Z" fill="#FDFCFB" stroke="#CBBDB9" stroke-width="4" stroke-linejoin="round"/>
                    
                    <!-- Envelope Flap (Open) -->
                    <path d="M30 100 L150 180 L270 100 Z" fill="#F7F5F4" stroke="#CBBDB9" stroke-width="4" stroke-linejoin="round"/>
                    
                    <!-- Envelope Front -->
                    <path d="M30 230 L130 160 L150 175 L170 160 L270 230 Z" fill="#FFFFFF" stroke="#CBBDB9" stroke-width="4" stroke-linejoin="round"/>
                    
                    <!-- Red Heart Seal -->
                    <path d="M150 220 C150 220 130 200 130 190 C130 180 140 175 150 185 C160 175 170 180 170 190 C170 200 150 220 150 220 Z" fill="#863F3F"/>
                </svg>
                <div class="click-me">click me</div>
            </div>

            <!-- 3. The Flowers (SVG) -->
            <svg class="svg-flowers" viewBox="0 0 150 250" fill="none" xmlns="http://www.w3.org/2000/svg">
                <!-- Wrapping Paper -->
                <path d="M40 120 L110 120 L130 240 L20 240 Z" fill="#FDFCFB" stroke="#CBBDB9" stroke-width="4" stroke-linejoin="round"/>
                <path d="M40 120 L75 200 L110 120 Z" fill="#F7F5F4" stroke="#CBBDB9" stroke-width="4" stroke-linejoin="round"/>
                <!-- Ribbon -->
                <path d="M20 220 Q75 240 130 220" stroke="#863F3F" stroke-width="8" stroke-linecap="round"/>
                <path d="M75 200 L60 240 M75 200 L90 230" stroke="#863F3F" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Flowers (Roses) -->
                <circle cx="50" cy="90" r="25" fill="#732624"/>
                <path d="M40 80 Q50 70 60 80 Q70 90 60 100 Q50 110 40 100 Q30 90 40 80 Z" stroke="#381413" stroke-width="3"/>
                
                <circle cx="100" cy="80" r="30" fill="#863F3F"/>
                <path d="M85 65 Q100 55 115 65 Q125 80 115 95 Q100 105 85 95 Q75 80 85 65 Z" stroke="#381413" stroke-width="3"/>

                <circle cx="75" cy="50" r="20" fill="#732624"/>
                <path d="M65 40 Q75 30 85 40 Q95 50 85 60 Q75 70 65 60 Q55 50 65 40 Z" stroke="#381413" stroke-width="3"/>
                
                <!-- Leaves -->
                <path d="M30 130 Q10 110 20 90 Q40 110 30 130 Z" fill="#4A5D23"/>
                <path d="M120 130 Q140 110 130 90 Q110 110 120 130 Z" fill="#4A5D23"/>
            </svg>

        </div>
    </div>

</body>
</html>
